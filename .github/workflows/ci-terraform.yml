##############################################################################
# CI/CD — Terraform Infrastructure
#
# Trigger: changes under pharma-devops/terraform/**
# Flow   :
#   PR     → fmt check + validate + Checkov/tfsec IaC scan + terraform plan
#   develop→ plan only (no apply — infra changes are deliberate, not continuous)
#   main   → terraform apply (with manual approval via environment gate)
#
# Each environment (dev/qa/prod) is handled as a separate job so they can
# be applied independently.
##############################################################################
name: "CI — Terraform"

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "pharma-devops/terraform/**"
      - ".github/workflows/ci-terraform.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "pharma-devops/terraform/**"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false   # never cancel in-flight terraform runs

env:
  TF_VERSION: "1.9.0"
  AWS_REGION: "us-east-1"

jobs:
  # ── Shared: IaC Security Scan ─────────────────────────────────────────────
  iac-scan:
    name: "IaC Security Scan (Checkov + tfsec)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Checkov — Terraform SAST
        uses: bridgecrewio/checkov-action@v12
        with:
          directory:     pharma-devops/terraform
          framework:     terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail:     false
          check:         >-
            CKV_AWS_8,CKV_AWS_18,CKV_AWS_21,CKV_AWS_117,
            CKV_AWS_149,CKV_AWS_161,CKV_AWS_173,CKV2_AWS_6
          # Fails on: unencrypted S3, public ECR, public RDS, unencrypted EKS secrets

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov-terraform

      - name: tfsec — Terraform security scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: pharma-devops/terraform
          format:            sarif
          sarif_file:        tfsec-results.sarif
          soft_fail:         false

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec-terraform

  # ── Plan / Apply (per environment) ───────────────────────────────────────
  terraform-dev:
    name: "Terraform — dev"
    needs: iac-scan
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'terraform-dev' || 'dev' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    defaults:
      run:
        working-directory: pharma-devops/terraform/envs/dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan-output.txt

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('pharma-devops/terraform/envs/dev/plan-output.txt', 'utf8');
            const truncated = plan.length > 65000 ? plan.slice(0, 65000) + '\n... (truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan — dev\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

  terraform-qa:
    name: "Terraform — qa"
    needs: [iac-scan, terraform-dev]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: terraform-qa    # separate environment with QA approvers
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: pharma-devops/terraform/envs/qa

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init
      - run: terraform plan -no-color -out=tfplan
      - run: terraform apply -auto-approve tfplan

  terraform-prod:
    name: "Terraform — prod (manual gate)"
    needs: [iac-scan, terraform-qa]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: terraform-prod  # strict: infra-lead + security approval required
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: pharma-devops/terraform/envs/prod

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init
      - run: terraform plan -no-color -out=tfplan
      - run: terraform apply -auto-approve tfplan
